name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-api:
    name: Build & Test API
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.3
      
      - name: Install dependencies
        working-directory: tools/apps/dlc-dev-api
        run: pnpm install --frozen-lockfile
      
      - name: Lint
        working-directory: tools/apps/dlc-dev-api
        run: pnpm lint
      
      - name: Type check
        working-directory: tools/apps/dlc-dev-api
        run: pnpm type-check
      
      - name: Build
        working-directory: tools/apps/dlc-dev-api
        run: pnpm build
      
      - name: Test
        working-directory: tools/apps/dlc-dev-api
        run: pnpm test || true
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: tools/apps/dlc-dev-api/dist/
          retention-days: 7

  build-web:
    name: Build & Test Web
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.3
      
      - name: Install dependencies
        working-directory: tools/apps/dlc-dev-web
        run: pnpm install --frozen-lockfile
      
      - name: Lint
        working-directory: tools/apps/dlc-dev-web
        run: pnpm lint || true
      
      - name: Type check
        working-directory: tools/apps/dlc-dev-web
        run: pnpm type-check
      
      - name: Build
        working-directory: tools/apps/dlc-dev-web
        run: pnpm build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: tools/apps/dlc-dev-web/.next/
          retention-days: 7

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: db_game
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.3
      
      - name: Install API dependencies
        working-directory: tools/apps/dlc-dev-api
        run: pnpm install --frozen-lockfile
      
      - name: Download API artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: tools/apps/dlc-dev-api/dist/
      
      - name: Start API server
        working-directory: tools/apps/dlc-dev-api
        env:
          NODE_ENV: test
          API_PORT: 30089
          DB_AUTH_HOST: 127.0.0.1
          DB_AUTH_PORT: 3306
          DB_AUTH_USER: root
          DB_AUTH_PASS: secret
          DB_AUTH_NAME: db_game
          DB_GAME_HOST: 127.0.0.1
          DB_GAME_PORT: 3306
          DB_GAME_USER: root
          DB_GAME_PASS: secret
          DB_GAME_NAME: db_game
          DB_DATA_HOST: 127.0.0.1
          DB_DATA_PORT: 3306
          DB_DATA_USER: root
          DB_DATA_PASS: secret
          DB_DATA_NAME: db_game
          DB_POST_HOST: 127.0.0.1
          DB_POST_PORT: 3306
          DB_POST_USER: root
          DB_POST_PASS: secret
          DB_POST_NAME: db_game
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: admin
          USE_CACHE: false
        run: |
          node dist/main.js &
          echo $! > api.pid
          sleep 10
      
      - name: Health check
        run: |
          response=$(curl -s http://localhost:30089/health)
          echo "Health check response: $response"
          status=$(echo $response | jq -r '.status')
          if [ "$status" != "ok" ] && [ "$status" != "degraded" ]; then
            echo "Health check failed with status: $status"
            exit 1
          fi
          echo "Health check passed with status: $status"
      
      - name: Test auth endpoint
        run: |
          response=$(curl -s -X POST http://localhost:30089/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin"}')
          echo "Auth response: $response"
          success=$(echo $response | jq -r '.success')
          if [ "$success" != "true" ]; then
            echo "Auth test failed"
            exit 1
          fi
          echo "Auth test passed"
      
      - name: Test metrics endpoint
        run: |
          response=$(curl -s http://localhost:30089/health/metrics)
          echo "Metrics response: $response"
          version=$(echo $response | jq -r '.version')
          if [ -z "$version" ]; then
            echo "Metrics test failed"
            exit 1
          fi
          echo "Metrics test passed, version: $version"
      
      - name: Stop API server
        if: always()
        run: |
          if [ -f tools/apps/dlc-dev-api/api.pid ]; then
            kill $(cat tools/apps/dlc-dev-api/api.pid) || true
          fi

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tools/apps/dlc-dev-api/Dockerfile
          push: false
          tags: dlc-dev-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Web Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tools/apps/dlc-dev-web/Dockerfile
          push: false
          tags: dlc-dev-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
